name: Markov fitting core
on: [push, pull_request]
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R_LIBS_USER: /tmp/research-r-library
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install narrow research dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-xts r-cran-dplyr r-cran-knitr r-cran-urca r-cran-nlme
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'install.packages("MSwM",repos="https://cloud.r-project.org",dependencies=FALSE)'
      - run: Rscript test_temporal.R
      - run: Rscript run_regime_core.R
      - run: Rscript run_regime_core.R --past-only
      - name: Verify source-pinned demo
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
          if ! verification="$(python3 scripts/verify_demo.py 2>&1)"; then
            echo "::error file=scripts/verify_demo.py,line=1::${verification//$'\n'/'%0A'}"
            exit 1
          fi
          echo "$verification"
          git diff --exit-code
